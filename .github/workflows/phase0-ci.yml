name: Phase 0 CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web-and-mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Web lint
        run: pnpm --dir web lint

      - name: Web typecheck
        run: pnpm --dir web typecheck

      - name: Web build
        run: pnpm --dir web build

      - name: Install Playwright Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Web browser smoke
        run: pnpm --dir web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

      - name: Mobile typecheck
        run: pnpm --dir mobile typecheck

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Django check
        working-directory: backend
        env:
          DJANGO_DB_ENGINE: django.db.backends.sqlite3
        run: python manage.py check

      - name: Backend tests
        working-directory: backend
        env:
          DJANGO_DB_ENGINE: django.db.backends.sqlite3
        run: pytest -q

  backend-production-like:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hrms_ci
          POSTGRES_USER: hrms_ci
          POSTGRES_PASSWORD: hrms_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrms_ci -d hrms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Static production preflight
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-production-like-secret
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
          POSTGRES_DB: hrms_ci
          POSTGRES_USER: hrms_ci
          POSTGRES_PASSWORD: hrms_ci_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://127.0.0.1:6379/0
          HRMS_ENABLE_DEMO_DATA: "false"
          HRMS_NOTIFICATION_PROCESSOR_ENABLED: "true"
          HRMS_PAYROLL_PROVIDER_WORKER_ENABLED: "true"
          HRMS_ENTERPRISE_IDENTITY_STATUS: not_in_scope
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          DJANGO_EMAIL_HOST: smtp.example.invalid
          DJANGO_DEFAULT_FROM_EMAIL: hrms@example.invalid
          HRMS_PAYROLL_PROVIDER_CREDENTIALS_JSON: '{"ci.provider.credential.v1":{"provider_ref":"payroll.provider.bank.production.v1","use_sandbox":true,"metadata":{"environment":"ci"}}}'
          HRMS_PAYROLL_ARTIFACT_STORAGE_CREDENTIALS_JSON: '{"ci.storage.credential.v1":{"provider_family":"s3","use_default_credentials":true,"metadata":{"environment":"ci"}}}'
          HRMS_PAYROLL_ARTIFACT_STORAGE_POLICIES_JSON: '{"ci.storage.policy.v1":{"enabled":true,"allowed_provider_families":["s3"],"allowed_credential_refs":["ci.storage.credential.v1"],"require_runtime_credentials":true}}'
        run: python manage.py production_preflight --strict --skip-network --json

      - name: Migrate Postgres schema
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.base
          DJANGO_SECRET_KEY: ci-base-secret
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: hrms_ci
          POSTGRES_USER: hrms_ci
          POSTGRES_PASSWORD: hrms_ci_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python manage.py migrate --noinput

      - name: Critical IAM tenant payroll tests on Postgres Redis
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.base
          DJANGO_SECRET_KEY: ci-base-secret
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: hrms_ci
          POSTGRES_USER: hrms_ci
          POSTGRES_PASSWORD: hrms_ci_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://127.0.0.1:6379/0
        run: >-
          pytest -q
          tests/test_account_email_flows.py
          tests/test_tenant_onboarding_api.py
          tests/test_tenant_admin_membership_invites.py
          tests/test_phase0_api_smoke.py
          -k "auth_login_session_logout_round_trip or employee_cannot_access_hr_admin_dashboard or payroll_provider_launch_rehearsal_proves_three_lane_production_readiness or configured_signed_url_storage_strategy or provider_credential or storage_policy"
