site_name: Accerio HRMS User Guide
site_description: Searchable user documentation for Accerio HRMS workspaces and workflows.
site_url: https://docs.accerio.in/
repo_url: https://github.com/sushil0586/hrms-payroll-saas

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Practical Scenario Coverage: scenario-coverage.md
  - Getting Started:
